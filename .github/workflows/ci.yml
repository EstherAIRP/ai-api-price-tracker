name: Validate price collector and frontend

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'site/**'
      - 'site/fees.js'
      - 'site/data/provider-fees.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/daily-prices.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site/app.js && node --check site/fees.js && node --test tests/test_fees.cjs && node --check site/estimate-core.js && node --check site/estimate.js && node --test tests/test_estimate.cjs && node --test tests/test_estimate_ui.cjs && node --test tests/test_money_display.cjs && node --test tests/test_column_sort.cjs && node --test tests/test_mobile_view.cjs
      - run: python scripts/build_site.py
